services:
  db:
    image: mysql:8.0
    container_name: recipe-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: recipe-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 64M
    networks:
      - backend_net
      - frontend_net
    depends_on:
      - db

  wordpress:
    image: wordpress:latest
    container_name: recipe-wordpress
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
    volumes:
      - wp_data:/var/www/html
    networks:
      - backend_net
      - frontend_net
    depends_on:
      - db

  nginx:
    image: nginx:latest
    container_name: recipe-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend_net
    depends_on:
      - wordpress

  prometheus:
    image: prom/prometheus:latest
    container_name: recipe-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - monitoring_net
      - backend_net

  grafana:
    image: grafana/grafana:latest
    container_name: recipe-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring_net
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: recipe-node-exporter
    restart: unless-stopped
    networks:
      - monitoring_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: recipe-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring_net

  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: recipe-mysql-exporter
    restart: unless-stopped
    environment:
      MYSQLD_EXPORTER_PASSWORD: "${MYSQL_PASSWORD}"
    command:
      - '--mysqld.address=db:3306'
      - '--mysqld.username=${MYSQL_USER}'
    networks:
      - monitoring_net
      - backend_net
    depends_on:
      - db

  loki:
    image: grafana/loki:latest
    container_name: recipe-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - monitoring_net

  promtail:
    image: grafana/promtail:latest
    container_name: recipe-promtail
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring_net
    depends_on:
      - loki

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  monitoring_net:
    driver: bridge

volumes:
  db_data:
  wp_data:
  prometheus_data:
  grafana_data:
  loki_data:
